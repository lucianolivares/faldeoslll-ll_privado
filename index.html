<title>Alarmas comunitarias · Faldeos III-II (privado)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ============ 1. tokens de diseño ============ */
:root{
  color-scheme:light;
  --bg:#eaeef3; --surface:#fff; --surface-2:#f5f7fa; --surface-3:#eceff4; --surface-alpha:rgba(255,255,255,.93);
  --border:#dde4ec; --border-2:#c8d2dd;
  --text:#0f1a24; --text-2:#56636f; --text-3:#8b98a5;
  --accent:#0f766e; --accent-ink:#fff; --accent-soft:#e3f1ef; --accent-brd:#bfe0da;
  --ok:#15803d; --ok-soft:#e6f4ea; --warn:#b45309; --warn-soft:#fdf2e0; --bad:#b91c1c; --bad-soft:#fdeaea;
  --gris:#b9c2cc; --gris-brd:#8b96a2;
  --halo:#fff; --map-bg:#e7ebf1;
  --sh-1:0 1px 2px rgba(15,26,36,.07);
  --sh-2:0 2px 4px -1px rgba(15,26,36,.06),0 14px 30px -10px rgba(15,26,36,.22);
  --r-s:8px; --r-m:12px; --r-l:16px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
/* tema oscuro: los mismos tokens, por preferencia del sistema y por elección explícita */
.plano-claro{opacity:1 !important}
.plano-oscuro{opacity:0 !important}
@media (prefers-color-scheme:dark){
  :root:not([data-tema="claro"]){
  --bg:#0a0e13; --surface:#141b23; --surface-2:#1a222c; --surface-3:#212b36; --surface-alpha:rgba(20,27,35,.94);
  --border:#26313d; --border-2:#3a4754;
  --text:#e6edf5; --text-2:#9aabbb; --text-3:#6b7d8e;
  --accent:#2dd4bf; --accent-ink:#04211e; --accent-soft:#11302d; --accent-brd:#1d4f49;
  --ok:#4ade80; --ok-soft:#12301f; --warn:#fbbf24; --warn-soft:#33270f; --bad:#f87171; --bad-soft:#3a1b1b;
  --gris:#4a5763; --gris-brd:#6a7784;
  --halo:#0d131a; --map-bg:#0b1016;
  --sh-1:0 1px 2px rgba(0,0,0,.45);
  --sh-2:0 2px 4px -1px rgba(0,0,0,.45),0 14px 30px -10px rgba(0,0,0,.7);
  color-scheme:dark;
}
  :root:not([data-tema="claro"]) .plano-claro{opacity:0 !important}
  :root:not([data-tema="claro"]) .plano-oscuro{opacity:1 !important}
}
:root[data-tema="oscuro"]{
  --bg:#0a0e13; --surface:#141b23; --surface-2:#1a222c; --surface-3:#212b36; --surface-alpha:rgba(20,27,35,.94);
  --border:#26313d; --border-2:#3a4754;
  --text:#e6edf5; --text-2:#9aabbb; --text-3:#6b7d8e;
  --accent:#2dd4bf; --accent-ink:#04211e; --accent-soft:#11302d; --accent-brd:#1d4f49;
  --ok:#4ade80; --ok-soft:#12301f; --warn:#fbbf24; --warn-soft:#33270f; --bad:#f87171; --bad-soft:#3a1b1b;
  --gris:#4a5763; --gris-brd:#6a7784;
  --halo:#0d131a; --map-bg:#0b1016;
  --sh-1:0 1px 2px rgba(0,0,0,.45);
  --sh-2:0 2px 4px -1px rgba(0,0,0,.45),0 14px 30px -10px rgba(0,0,0,.7);
  color-scheme:dark;
}
:root[data-tema="oscuro"] .plano-claro{opacity:0 !important}
:root[data-tema="oscuro"] .plano-oscuro{opacity:1 !important}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ============ 2. estructura ============ */
#app{display:grid;grid-template-columns:1fr 400px;grid-template-rows:56px 1fr;height:100%}
header{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border);z-index:1200;min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:31px;height:31px;color:var(--accent);flex:none;display:grid;place-items:center}
.brand .logo svg{width:100%;height:100%;display:block;fill:currentColor}
.brand h1{font-size:14.5px;margin:0;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.brand small{display:block;font-size:11px;color:var(--text-2);font-weight:500;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10.5px;padding:3px 9px;border-radius:999px;font-weight:650;letter-spacing:.3px;white-space:nowrap;flex:none}
.tag.priv{background:var(--bad-soft);color:var(--bad)}.tag.pub{background:var(--ok-soft);color:var(--ok)}
.search{position:relative;flex:1;max-width:360px;margin-left:auto;min-width:120px}
.search input{width:100%;height:38px;padding:0 12px 0 34px;border:1px solid var(--border);border-radius:10px;font-size:13px;background:var(--surface-2);outline:none;color:var(--text)}
.search input::placeholder{color:var(--text-3)}
.search input:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:var(--text-3);pointer-events:none}
.hbtn{width:38px;height:38px;flex:none;display:grid;place-items:center;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);cursor:pointer;color:var(--text-2)}
.hbtn:hover{background:var(--surface-3);color:var(--text)}
.src{font-size:11.5px;color:var(--text-2);display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.src i{width:8px;height:8px;border-radius:50%;background:var(--text-3);display:inline-block;flex:none}
.src.live i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
#map{background:var(--map-bg);position:relative;min-height:0}

/* ============ 3. controles flotantes del mapa ============ */
.mapctl{position:absolute;top:12px;right:12px;z-index:900;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.fab{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;background:var(--surface-alpha);backdrop-filter:blur(8px);border:1px solid var(--border);box-shadow:var(--sh-2);font-size:13px;font-weight:600;cursor:pointer;color:var(--text)}
.fab svg{width:17px;height:17px;flex:none}
.fab .pip[hidden]{display:none}
.fab .pip{min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center}
.aviso{max-width:290px;display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-radius:var(--r-m);background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);box-shadow:var(--sh-2);font-size:12.5px;line-height:1.45;color:var(--text);cursor:pointer;text-align:left}
.aviso b{color:var(--warn)}
.sheet{position:absolute;top:60px;right:12px;width:306px;max-height:calc(100% - 76px);z-index:1000;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-l);box-shadow:var(--sh-2);display:flex;flex-direction:column;overflow:hidden}
.sheet[hidden]{display:none}
.sheet-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);flex:none}
.sheet-h b{flex:1;font-size:13.5px}
.sheet-b{overflow:auto;padding:4px 14px 12px;flex:1;-webkit-overflow-scrolling:touch}
.sheet-f{padding:10px 0 2px;border-top:1px solid var(--border);margin-top:10px}
.icon{width:30px;height:30px;display:grid;place-items:center;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--text-2)}
.icon:hover{background:var(--surface-3);color:var(--text)}
.sec{margin-top:12px}
.sec h4{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--text-3);margin:0 0 7px;font-weight:700}
.opt{display:flex;align-items:center;gap:10px;min-height:38px;padding:4px 8px;border-radius:9px;cursor:pointer;font-size:13px;user-select:none}
.opt:hover{background:var(--surface-2)}
.opt input{margin:0;accent-color:var(--accent);width:16px;height:16px;flex:none}
.opt .t{flex:1;min-width:0}
.opt .n{font-size:11.5px;font-weight:700;color:var(--text-2);background:var(--surface-3);border-radius:999px;padding:1px 8px;flex:none}
.opt .n.hit{background:var(--warn-soft);color:var(--warn)}
.opt.on{background:var(--accent-soft)}
.creditos{display:flex;align-items:center;gap:9px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-3);line-height:1.4}
.creditos svg{width:22px;height:22px;flex:none;fill:currentColor;display:block}
.creditos b{color:var(--text-2);font-weight:650}
.leg{font-size:12.5px;line-height:1.9;color:var(--text-2)}
.leg .sw{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:8px;border:1.5px solid var(--halo);box-shadow:0 0 0 1px var(--border-2)}
.leg .sq{border-radius:2px;transform:rotate(45deg) scale(.85)}
.leg .ring{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:8px;border:2px dashed var(--text-3)}
.leg .disc{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:8px;border:1.5px solid var(--text-3);background:color-mix(in srgb,var(--text-3) 22%,transparent)}
.leg .amb{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:8px;border:2px dashed var(--warn)}

/* ============ 4. panel lateral ============ */
aside{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;z-index:1100}
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 6px;flex:none}
.tabs button{flex:1;padding:13px 4px;border:0;background:none;font-size:12.5px;font-weight:600;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--text);border-color:var(--accent)}
.grip{display:none}
.body{overflow:auto;padding:16px;flex:1;-webkit-overflow-scrolling:touch}
h2{font-size:15.5px;margin:0 0 3px;font-weight:650;line-height:1.3}
h3{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--text-3);margin:20px 0 8px;font-weight:700}
.sub{color:var(--text-2);font-size:12.5px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:116px 1fr;gap:7px 10px;margin:12px 0;font-size:13px}
.kv div:nth-child(odd){color:var(--text-2)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:650;color:#fff;vertical-align:middle}
.pill.gris{background:var(--surface-3);color:var(--text-2)}
.card{border:1px solid var(--border);border-radius:var(--r-m);padding:11px 13px;margin:8px 0;background:var(--surface)}
.card b{display:block;font-weight:600}
.meta{color:var(--text-2);font-size:12px}
.card a{color:var(--text);text-decoration:none;font-variant-numeric:tabular-nums;font-weight:600}
.inf{color:var(--text-3)}
.empty{color:var(--text-2);padding:28px 8px;text-align:center;line-height:1.55}
.note{font-size:12px;color:var(--text-2);border-top:1px solid var(--border);margin-top:18px;padding-top:11px;line-height:1.55}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.w{width:100%}
.btn:hover{filter:brightness(.97)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.aviso-box{margin:14px 0 4px;padding:13px;border-radius:var(--r-m);background:var(--accent-soft);border:1px solid var(--accent-brd)}
.aviso-box.pend{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 32%,transparent)}
.aviso-box.done{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 28%,transparent)}
.aviso-box .meta{margin-top:9px;line-height:1.5}
.aviso-box ul{margin:8px 0 0;padding-left:18px;font-size:12.5px;line-height:1.6;color:var(--text-2)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
.stat div{background:var(--surface-2);border-radius:var(--r-m);padding:11px 8px;text-align:center}
.stat .n{font-size:20px;font-weight:700;line-height:1.1}
.stat .l{font-size:11px;color:var(--text-2);margin-top:3px}
.bar{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden;margin:5px 0 2px}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.cupo{margin:9px 0 13px}
.cupo .t{display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0}
.chips span{font-size:11.5px;padding:4px 9px;border-radius:7px;background:var(--surface-2);cursor:pointer;border:1px solid transparent;font-weight:500}
.chips span:hover{border-color:var(--border-2)}
.chips span.bad{background:var(--bad-soft);color:var(--bad)}
.chips span.warn{background:var(--warn-soft);color:var(--warn)}
.range{display:grid;grid-template-columns:1fr 78px;gap:9px;align-items:center;margin:8px 0}
.range input[type=range]{width:100%;accent-color:var(--accent);height:24px}
.range input[type=number]{width:100%;padding:7px;border:1px solid var(--border);border-radius:8px;font-size:12.5px;background:var(--surface);color:var(--text)}
.range label{grid-column:1/3;font-size:12.5px;display:flex;justify-content:space-between;color:var(--text-2)}
.range label b{color:var(--text);font-weight:600}
.trig{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.trig:last-child{border:0}
.trig .st{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px}
.st.ok{background:var(--ok)}.st.warn{background:var(--warn)}.st.bad{background:var(--bad)}
.lista .card{cursor:pointer}
.lista .card:hover{border-color:var(--border-2);background:var(--surface-2)}
.tagline{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;margin:2px 4px 2px 0}
.tagline.w{background:var(--warn-soft);color:var(--warn)}
.tagline.b{background:var(--bad-soft);color:var(--bad)}
.tagline.g{background:var(--ok-soft);color:var(--ok)}

/* ============ 5. mapa: marcadores y rótulos ============ */
.house{width:0;height:0}
.house svg{position:absolute;left:-22px;top:-22px;overflow:visible;filter:drop-shadow(0 1px 2px rgba(0,0,0,.28));transform:scale(var(--mk,1));transform-origin:22px 22px;transition:transform .15s ease}
.house .dim{opacity:.2}
.mk-n{font-family:inherit;font-size:11.5px;font-weight:700;letter-spacing:-.3px}
#map[data-detalle="0"] .mk-n{display:none}
.plano{transition:opacity .25s ease}
.lbl{font-size:11px;font-weight:650;color:var(--text);white-space:nowrap;text-shadow:0 0 3px var(--halo),0 0 3px var(--halo),0 0 4px var(--halo)}
.street{display:inline-block;position:absolute;left:0;top:0;font-size:13px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--text-2);white-space:nowrap;text-shadow:0 0 4px var(--halo),0 0 4px var(--halo),0 0 7px var(--halo);pointer-events:none}
.idbadge{position:absolute;left:10px;top:-32px;background:var(--text);color:var(--surface);font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;white-space:nowrap;letter-spacing:.3px}
.leaflet-tooltip.num{background:transparent;border:0;box-shadow:none;padding:0}
.leaflet-tooltip.num::before{display:none}
.leaflet-container{font-family:inherit;background:var(--map-bg)}
.leaflet-bar a,.leaflet-bar a:hover{background:var(--surface);color:var(--text);border-bottom-color:var(--border);width:34px;height:34px;line-height:34px}
.leaflet-bar{border:1px solid var(--border);box-shadow:var(--sh-1)}

         border-radius:var(--r-l) var(--r-l) 0 0;padding-bottom:var(--safe-b);z-index:1300}

<div id="app" data-hoja="cerrada">

<script>
// ===================== CONFIGURACIÓN =====================
// Enlaces "Archivo → Compartir → Publicar en la web → CSV" de cada pestaña de la planilla.
// Si quedan vacíos, el mapa usa la copia embebida (SNAPSHOT) al final del archivo.
const CONFIG = {
  csv: {
    casas:     "https://docs.google.com/spreadsheets/d/e/2PACX-1vQsTwkcmZm2w0N_GrKs9Pejb3WZ6Pt_iQANRcGoUyrnr3ynulg2lQQzkoWZEytyW0VBdZ75Fxkk_fu_/pub?single=true&output=csv&gid=913056490",
    contactos: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQsTwkcmZm2w0N_GrKs9Pejb3WZ6Pt_iQANRcGoUyrnr3ynulg2lQQzkoWZEytyW0VBdZ75Fxkk_fu_/pub?single=true&output=csv&gid=2118395776",
    controles: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQsTwkcmZm2w0N_GrKs9Pejb3WZ6Pt_iQANRcGoUyrnr3ynulg2lQQzkoWZEytyW0VBdZ75Fxkk_fu_/pub?single=true&output=csv&gid=1268667683",
    alarmas:   "https://docs.google.com/spreadsheets/d/e/2PACX-1vQsTwkcmZm2w0N_GrKs9Pejb3WZ6Pt_iQANRcGoUyrnr3ynulg2lQQzkoWZEytyW0VBdZ75Fxkk_fu_/pub?single=true&output=csv&gid=1504940346"
  },
  // el plano tiene dos versiones (tema claro y oscuro). ancho/alto = sistema de coord_x / coord_y.
  plano: { claro: "plano_claro.webp", oscuro: "plano_oscuro.webp", ancho: 3651, alto: 4953 },
  pxPorMetro: 17.3,               // escala calibrada con el terreno C-02 (10,15 m de frente)
  cupos: { numeros: 200, controles: 20, controlesTotal: 60 },
  minContactos: 2,                // menos de esto = "pocos contactos"
  colores: { A: "#0e8f8a", B: "#6a4fd8", C: "#e07b1a", D: "#b5316b" },
  nombresSector: { A: "Sector A · Norte (A1)", B: "Sector B · Oriente (A2)", C: "Sector C · Surponiente (A3)", D: "Sector D" },
  vias: [
    { nombre: "Calle Jorge Armando Saavedra Plaza", x: 2100, y: 1000, rot: 27,  minZoom: -9 },
    { nombre: "Calle Inés Verdejo González",        x: 880,  y: 2750, rot: -80, minZoom: -9 },
    { nombre: "Calle Inés Verdejo González",        x: 1650, y: 4060, rot: 10,  minZoom: -1.75 },
    { nombre: "Calle Inés Verdejo González",        x: 2830, y: 3500, rot: -80, minZoom: -1.75 },
    { nombre: "Pasaje Rafael Segundo Araya Villanueva", x: 1620, y: 2590, rot: 30,  minZoom: -1.75 },
    { nombre: "Pasaje Alfonso del Carmen Araya Castillo", x: 1510, y: 3080, rot: -38, minZoom: -1.75 },
    { nombre: "Pasaje Dafne Castillo",              x: 2550, y: 3130, rot: -70, minZoom: -1.75 }
  ],
  privado: true,
  form: {   // Google Form de completado de datos. Los entry.* son los IDs de las preguntas prellenadas.
    url: "https://docs.google.com/forms/d/e/1FAIpQLSfDikyDrbRmFa0d-H55p2ZRkf5KdFDhbRB5zBl_p0F-MJLtiw/viewform",
    entryIdCasa: "entry.195855574", entryDireccion: "entry.2050356861", entryNombre: "entry.223763820",
    // El plazo del formulario ya venció: solo se ofrece a las viviendas con datos pendientes.
    soloPendientes: true
  }
};
// ==========================================================

/* ---------------- utilidades ---------------- */
const si  = v => (v || "").toString().trim().toLowerCase() === "sí";
const esc = s => (s ?? "").toString().replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) ? n : 0; };
const txt = v => (v ?? "").toString().trim();
const tel164 = v => { let d = String(v ?? "").replace(/\.0+$/, "").replace(/\D/g, ""); if (d.length === 9 && d[0] === "9") d = "56" + d; return d.length === 11 && d.startsWith("56") ? "+" + d : txt(v); };
const telValido = v => /^\+569\d{8}$/.test(tel164(v));
const plural = (n, s, p) => n + " " + (n === 1 ? s : (p || s + "s"));

/* ---------------- tema claro / oscuro ---------------- */
const TEMA_KEY = "faldeos_tema";
const TEMAS = ["auto", "claro", "oscuro"];
const ICONO_TEMA = {
  auto:   '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 010 16" fill="currentColor" stroke="none"/></svg>',
  claro:  '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  oscuro: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 13A9 9 0 1111 3a7 7 0 1010 10z"/></svg>'
};
let TEMA = "auto";
try { const t = localStorage.getItem(TEMA_KEY); if (TEMAS.includes(t)) TEMA = t; } catch (e) {}
function aplicarTema() {
  const r = document.documentElement;
  if (TEMA === "auto") r.removeAttribute("data-tema"); else r.setAttribute("data-tema", TEMA);
  const b = document.getElementById("btnTema");
  b.innerHTML = ICONO_TEMA[TEMA];
  b.title = "Tema: " + (TEMA === "auto" ? "automático (según el sistema)" : TEMA);
}
document.getElementById("btnTema").addEventListener("click", () => {
  TEMA = TEMAS[(TEMAS.indexOf(TEMA) + 1) % TEMAS.length];
  try { localStorage.setItem(TEMA_KEY, TEMA); } catch (e) {}
  aplicarTema();
});
aplicarTema();

/* ---------------- mapa ---------------- */
const W = CONFIG.plano.ancho, H = CONFIG.plano.alto;
const toLL = (x, y) => [H - y, x];
const map = L.map("map", { crs: L.CRS.Simple, minZoom: -3.5, maxZoom: 2, zoomSnap: 0, zoomDelta: .5, attributionControl: false, zoomControl: false, tap: true });
L.control.zoom({ position: "topleft", zoomInTitle: "Acercar", zoomOutTitle: "Alejar" }).addTo(map);
const bounds = [[0, 0], [H, W]];
L.imageOverlay(CONFIG.plano.claro,  bounds, { className: "plano plano-claro"  }).addTo(map);
L.imageOverlay(CONFIG.plano.oscuro, bounds, { className: "plano plano-oscuro" }).addTo(map);
map.fitBounds(bounds, { padding: [6, 6] });
map.setMaxBounds([[-900, -900], [H + 900, W + 900]]);

const layers = { audible: L.layerGroup().addTo(map), rf: L.layerGroup().addTo(map), casas: L.layerGroup().addTo(map), vias: L.layerGroup().addTo(map) };
let DATA = { casas: [], contactos: [], controles: [], alarmas: [] };
let markers = {}, byId = {}, DIAG = {}, TELIX = {};

/* ---------------- ajustes locales (radios y escala) ---------------- */
const LS_KEY = "faldeos_ajustes_v1";
let AJ = { pxPorMetro: null, alarmas: {} };
try { AJ = Object.assign(AJ, JSON.parse(localStorage.getItem(LS_KEY) || "{}")); } catch (e) {}
const saveAJ = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(AJ)); } catch (e) {} };
const pxm = () => AJ.pxPorMetro || CONFIG.pxPorMetro;
function radios(al) {
  const o = AJ.alarmas[al.id_sector] || {};
  return { audible: o.audible ?? num(al.radio_audible_m), rf: o.rf ?? num(al.radio_rf_m), editado: o.audible != null || o.rf != null };
}
const distM = (a, b) => Math.hypot(num(a.coord_x) - num(b.coord_x), num(a.coord_y) - num(b.coord_y)) / pxm();

/* ---------------- carga de la planilla ---------------- */
function parseCSV(t) { return Papa.parse(t.trim(), { header: true, skipEmptyLines: true, transformHeader: h => h.trim() }).data; }
async function loadTab(name) {
  const url = CONFIG.csv[name];
  if (url) {
    const r = await fetch(url + (url.includes("?") ? "&" : "?") + "_=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(name + ": HTTP " + r.status);
    return { rows: parseCSV(await r.text()), live: true };
  }
  return { rows: parseCSV(SNAPSHOT[name]), live: false };
}
async function loadAll() {
  const names = ["casas", "contactos", "controles", "alarmas"]; let live = 0;
  for (const n of names) {
    try { const t = await loadTab(n); DATA[n] = t.rows; if (t.live) live++; }
    catch (e) { console.warn(e); DATA[n] = parseCSV(SNAPSHOT[n]); }
  }
  DATA.alarmas = DATA.alarmas.filter(a => /^[A-Z]$/.test(txt(a.id_sector)));
  byId = Object.fromEntries(DATA.casas.map(c => [c.id_casa, c]));
  const src = document.getElementById("src");
  src.className = "src" + (live === names.length ? " live" : "");
  const local = location.protocol === "file:";
  src.innerHTML = "<i></i><span>" + (live === names.length ? "Planilla en vivo" : live ? live + "/4 pestañas en vivo" : "Copia local del " + SNAPSHOT_FECHA + (local ? " · abierto desde el disco" : "")) + "</span>";
  if (local && live < names.length) src.title = "Google no entrega los CSV a páginas abiertas desde el disco (origen file://). Publicado en un sitio web o servido con http://localhost, el mapa lee la planilla en vivo.";
  render();
}

/* =========================================================
   DIAGNÓSTICO DE DATOS  (qué le falta a cada vivienda)
   ========================================================= */
const usado = k => !!(txt(k.nombre) || txt(k.telefono));
const telOK = k => !!(txt(k.telefono) && txt(k.estado_telefono) === "ok");
const ctsDe = id => DATA.contactos.filter(k => k.id_casa === id && usado(k));
const quien = k => txt(k.nombre) || "espacio " + txt(k.id_contacto);

function indexarTelefonos() {
  TELIX = {};
  for (const k of DATA.contactos) {
    const t = tel164(k.telefono); if (!t || !k.id_casa) continue;
    (TELIX[t] = TELIX[t] || []).push(k);
  }
}
// Devuelve { aplica, nTel, nCts, faltas[], incons[], pendiente }
function diagnosticar(c) {
  const d = { aplica: si(c.afiliada) || txt(c.afiliada).toLowerCase() === "compromiso", nTel: 0, nCts: 0, faltas: [], incons: [] };
  if (CONFIG.privado) {
    const cts = ctsDe(c.id_casa);
    const conTel = cts.filter(telOK);
    d.nCts = cts.length; d.nTel = conTel.length;
    if (!d.aplica) { d.pendiente = false; return d; }
    if (!d.nTel) d.faltas.push("sin ningún teléfono válido registrado");
    else if (d.nTel < CONFIG.minContactos) d.faltas.push("solo " + plural(d.nTel, "teléfono") + " · conviene al menos " + CONFIG.minContactos);
    const sinTel = cts.filter(k => !txt(k.telefono));
    if (sinTel.length) d.faltas.push(plural(sinTel.length, "contacto") + " sin teléfono (" + sinTel.map(quien).join(", ") + ")");
    const sinNombre = cts.filter(k => txt(k.telefono) && !txt(k.nombre) && !/menores de edad/i.test(txt(k.nota)));
    if (sinNombre.length) d.faltas.push(plural(sinNombre.length, "teléfono") + " sin nombre");
    const sinVerif = conTel.filter(k => !si(k.verificado));
    if (sinVerif.length) d.faltas.push(plural(sinVerif.length, "teléfono") + " sin verificar");
    if (!cts.some(k => num(k.prioridad) === 1) && cts.length) d.faltas.push("sin administrador en el espacio 1");
    // inconsistencias
    const vistos = {};
    for (const k of cts) {
      const e = txt(k.estado_telefono), t = tel164(k.telefono);
      if (e === "revisar")   d.incons.push(quien(k) + ": teléfono marcado para revisar");
      if (e === "duplicado") d.incons.push(quien(k) + ": teléfono marcado como duplicado");
      if (txt(k.telefono) && !telValido(k.telefono)) d.incons.push(quien(k) + ": el número no tiene el formato +569########");
      if (t) { if (vistos[t]) d.incons.push("el número " + t + " está dos veces en la casa"); vistos[t] = 1; }
      if (t && (TELIX[t] || []).some(o => o.id_casa && o.id_casa !== c.id_casa))
        d.incons.push("el número " + t + " también figura en " + [...new Set((TELIX[t] || []).filter(o => o.id_casa && o.id_casa !== c.id_casa).map(o => o.id_casa))].join(", "));
      if (txt(k.autoriza) === "No autorizo" && si(k.cargado_en_alarma)) d.incons.push(quien(k) + ": no autoriza el uso de sus datos pero figura cargado en la alarma");
      if (si(k.cargado_en_alarma) && !txt(k.fecha_carga)) d.incons.push(quien(k) + ": cargado en la alarma sin fecha de carga");
      if (si(k.verificado) && !telOK(k)) d.incons.push(quien(k) + ": marcado como verificado pero sin teléfono válido");
    }
    if (si(c.afiliada) && !num(c.bloque)) d.incons.push("casa afiliada sin bloque asignado en la planilla");
    if (si(c.tiene_control) && !DATA.controles.some(k => k.id_casa === c.id_casa)) d.incons.push("marcada con control RF pero sin número asignado");
  } else {
    d.nTel = num(c.telefonos_ok);
    const adm = DATA.contactos.filter(k => k.id_casa === c.id_casa && txt(k.nombre));
    d.nCts = adm.length;
    if (!d.aplica) { d.pendiente = false; return d; }
    if (!adm.length) d.faltas.push("sin administrador registrado");
    if (!d.nTel) d.faltas.push("sin teléfonos registrados para activar la alarma");
    else if (d.nTel < CONFIG.minContactos) d.faltas.push("solo " + plural(d.nTel, "teléfono") + " registrado · conviene al menos " + CONFIG.minContactos);

}
function recalcular() {
  indexarTelefonos(); DIAG = {};

}
const dg = c => DIAG[c.id_casa] || { faltas: [], incons: [], nTel: 0, nCts: 0, pendiente: false, aplica: false };

/* =========================================================
   CAPAS, RESALTADOS Y LEYENDA (un solo panel)
   ========================================================= */
const CAPAS = [
  ["audible",   "Alcance audible de las sirenas"],
  ["rf",        "Alcance de los controles (RF)"],
  ["noafil",    "Viviendas no afiliadas"],
  ["numeros",   "Números de casa"],
  ["calles",    "Nombres de calles"],
  ["pendientes","Marcar las que tienen datos pendientes"]
];
const RESALTES = [["pendiente", "Con algo pendiente (todo lo de abajo)"], ["sin_tel", "Sin ningún teléfono válido"], ["pocos", "Con menos de 2 teléfonos"], ["falta_tel", "Contacto asignado sin teléfono"], ["incompleto", "Contacto sin información obligatoria"], ["sin_verif", "Con datos sin verificar"], ["inconsistencia", "Con inconsistencias detectadas"], ["no_cargado", "Con teléfonos sin cargar en la alarma"], ["sin_admin", "Sin administrador en el espacio 1"], ["sin_control", "Sin control RF"]];
// Estado inicial: sin capas, sin filtros, sin resaltados (punto 6).
const VIS = Object.fromEntries(CAPAS.map(([k]) => [k, false]));
let RESALTE = "";

function cumpleResalte(c, modo) {
  const d = dg(c); if (!d.aplica) return false;
  const cts = CONFIG.privado ? ctsDe(c.id_casa) : [];
  switch (modo) {
    case "pendiente":   return d.pendiente;
    case "sin_tel":     return d.nTel === 0;
    case "pocos":       return d.nTel > 0 && d.nTel < CONFIG.minContactos;
    case "falta_tel":   return cts.some(k => txt(k.nombre) && !txt(k.telefono));
    case "incompleto":  return cts.some(k => (txt(k.telefono) && !txt(k.nombre) && !/menores de edad/i.test(txt(k.nota))) || (txt(k.nombre) && !txt(k.telefono)));
    case "sin_verif":   return cts.some(k => telOK(k) && !si(k.verificado));
    case "inconsistencia": return d.incons.length > 0;
    case "no_cargado":  return cts.some(k => telOK(k) && !si(k.cargado_en_alarma));
    case "sin_control": return !si(c.tiene_control);
    case "sin_admin":   return CONFIG.privado ? !cts.some(k => num(k.prioridad) === 1) : !DATA.contactos.some(k => k.id_casa === c.id_casa && txt(k.nombre));
  }
  return false;
}
const cuentaResalte = m => DATA.casas.filter(c => cumpleResalte(c, m)).length;

function pintarControles() {

  document.getElementById("resaltes").innerHTML =
    `<label class="opt${RESALTE ? "" : " on"}"><input type="radio" name="res" data-res=""${RESALTE ? "" : " checked"}><span class="t">Ninguno</span></label>` +
    RESALTES.map(([k, t]) => {
      const n = cuentaResalte(k);
      return `<label class="opt${RESALTE === k ? " on" : ""}"><input type="radio" name="res" data-res="${k}"${RESALTE === k ? " checked" : ""}><span class="t">${t}</span><b class="n${n ? " hit" : ""}">${n}</b></label>`;
    }).join("");
  document.querySelectorAll('#capas input').forEach(i => i.addEventListener("change", () => { VIS[i.dataset.capa] = i.checked; render(); }));
  document.querySelectorAll('#resaltes input').forEach(i => i.addEventListener("change", () => { RESALTE = i.dataset.res; render(); }));

  const pip = document.getElementById("ctlPip");

}

const ZOOM_DETALLE = -1.25;
function colorCasa(c) { return si(c.afiliada) ? (CONFIG.colores[txt(c.sector)] || "#3b82f6") : null; }
function iconCasa(c) {
  const col = colorCasa(c), fill = col || "var(--gris)", stroke = col ? "var(--halo)" : "var(--gris-brd)";
  const d = dg(c);
  const anf = si(c.es_anfitriona), ctrl = si(c.tiene_control), ident = si(c.modulo_identificador);

  const res = RESALTE && cumpleResalte(c, RESALTE);

    ? (pocos ? `<circle class="mk-n" r="7.4" fill="var(--halo)"/>` : "") +

    : "";
  const svg =
    `<svg width="44" height="44" viewBox="-22 -22 44 44">` +
      (res ? `<circle r="18" fill="none" stroke="var(--warn)" stroke-width="3.2" stroke-dasharray="5 4"/>` : "") +
      (anf ? `<circle r="15.5" fill="none" stroke="${fill}" stroke-width="2" opacity=".5"/>` : "") +
      `<circle r="12.4" fill="var(--halo)" opacity=".8"/>` +
      `<circle r="10.8" fill="${fill}" stroke="${stroke}" stroke-width="2.2"${comp ? ' stroke-dasharray="3.2 2.4"' : ""}/>` +
      nTxt +
      (ctrl ? `<rect x="-3.9" y="-3.9" width="7.8" height="7.8" rx="1.4" transform="translate(9.6,9.6) rotate(45)" fill="var(--halo)" stroke="${fill}" stroke-width="1.8"/>` : "") +
      (anf ? `<path transform="translate(0,-17) scale(.62)" d="M0,-9.5 L2.8,-3 L9.7,-2.7 L4.3,1.7 L6.1,8.4 L0,4.6 L-6.1,8.4 L-4.3,1.7 L-9.7,-2.7 L-2.8,-3 Z" fill="${fill}" stroke="var(--halo)" stroke-width="2" paint-order="stroke"/>` : "") +
      (pend ? `<circle cx="-9.6" cy="-9.6" r="4.3" fill="var(--warn)" stroke="var(--halo)" stroke-width="1.8"/>` : "") +
    `</svg>` + (ident ? `<span class="idbadge">ID</span>` : "");
  const html = RESALTE && !res ? `<span class="dim">${svg}</span>` : svg;
  return L.divIcon({ className: "house", html, iconSize: [0, 0], iconAnchor: [0, 0] });
}
function alarmaDe(c) { return DATA.alarmas.find(a => txt(a.id_casa_anfitriona) === c.id_casa); }

function render() {
  recalcular();
  Object.values(layers).forEach(l => l.clearLayers()); markers = {};
  for (const al of DATA.alarmas) {
    const anf = byId[txt(al.id_casa_anfitriona)]; if (!anf || !num(anf.coord_x)) continue;
    const col = CONFIG.colores[al.id_sector] || "#3b82f6", r = radios(al), ll = toLL(num(anf.coord_x), num(anf.coord_y));
    if (VIS.audible && r.audible > 0) L.circle(ll, { radius: r.audible * pxm(), color: col, weight: 1.5, fillColor: col, fillOpacity: .07, opacity: .75 }).on("click", () => showAlarma(al.id_sector)).addTo(layers.audible);
    if (VIS.rf && r.rf > 0) L.circle(ll, { radius: r.rf * pxm(), color: col, weight: 1.5, dashArray: "8 6", fill: false, opacity: .85 }).on("click", () => showAlarma(al.id_sector)).addTo(layers.rf);
  }
  for (const c of DATA.casas) {
    const x = num(c.coord_x), y = num(c.coord_y); if (!x || !y) continue;
    if (!VIS.noafil && !si(c.afiliada) && txt(c.afiliada).toLowerCase() !== "compromiso") continue;
    const m = L.marker(toLL(x, y), { icon: iconCasa(c), riseOnHover: true, keyboard: false }).addTo(layers.casas);
    m.on("click", () => { showCasa(c.id_casa); abrirHoja(); });
    if (VIS.numeros) m.bindTooltip(`<span class="lbl">${esc(c.numero)}</span>`, { permanent: true, direction: "right", offset: [14, 0], className: "num", interactive: false });
    markers[c.id_casa] = m;
  }
  if (VIS.calles) for (const v of CONFIG.vias)
    L.marker(toLL(v.x, v.y), { interactive: false, icon: L.divIcon({ className: "", html: `<div class="street" data-minzoom="${v.minZoom ?? -9}" style="transform:translate(-50%,-50%) rotate(${v.rot}deg)">${v.nombre}</div>`, iconSize: [0, 0] }) }).addTo(layers.vias);
  ajustarZoom(); pintarControles(); pintarLeyenda(); pintarAviso();
  if (activeTab === "resumen") showResumen();
  if (activeTab === "pendientes") showPendientes();
}
function ajustarZoom() {
  const z = map.getZoom(), det = z >= ZOOM_DETALLE;

  el.dataset.detalle = det ? "1" : "0";

}

/* aviso flotante: viviendas con datos pendientes */
function pintarAviso() {

  el.onclick = () => { VIS.pendientes = true; RESALTE = "pendiente"; render(); goTab("pendientes"); abrirHoja(); };
}

/* =========================================================
   ANÁLISIS DE COBERTURA
   ========================================================= */
function analisis() {
  const afil = DATA.casas.filter(c => si(c.afiliada));
  const porSector = {};
  for (const al of DATA.alarmas) {
    const s = al.id_sector, anf = byId[txt(al.id_casa_anfitriona)], r = radios(al);
    const casas = DATA.casas.filter(c => txt(c.sector) === s);
    const afilS = casas.filter(c => si(c.afiliada));
    const ctrlCasas = afilS.filter(c => si(c.tiene_control));
    const ctrlEnl = DATA.controles.filter(k => txt(k.sector) === s && ["enlazado", "probado", "entregado"].includes(txt(k.estado).toLowerCase()));
    const cts = CONFIG.privado
      ? DATA.contactos.filter(k => byId[k.id_casa] && txt(byId[k.id_casa].sector) === s && telOK(k))
      : [];
    const cargados = cts.filter(k => si(k.cargado_en_alarma)), verificados = cargados.filter(k => si(k.verificado));
    const telSector = CONFIG.privado ? cts.length : afilS.reduce((a, c) => a + num(c.telefonos_ok), 0);
    const fueraAud = anf ? afilS.filter(c => distM(c, anf) > r.audible) : afilS;
    const fueraRF = anf ? ctrlCasas.filter(c => distM(c, anf) > r.rf) : ctrlCasas;
    const lejana = anf && afilS.length ? afilS.map(c => [distM(c, anf), c]).sort((a, b) => b[0] - a[0])[0] : null;
    porSector[s] = { al, anf, r, casas, afilS, ctrlCasas, ctrlEnl, cts, cargados, verificados, telSector, fueraAud, fueraRF, lejana };
  }
  const anfs = DATA.alarmas.map(a => ({ a, anf: byId[txt(a.id_casa_anfitriona)], r: radios(a) })).filter(o => o.anf);
  const sinSirena = afil.filter(c => !anfs.some(o => distM(c, o.anf) <= o.r.audible));
  const sinRF = afil.filter(c => si(c.tiene_control) && !anfs.some(o => distM(c, o.anf) <= o.r.rf));
  return { afil, porSector, sinSirena, sinRF, totalCtrl: afil.filter(c => si(c.tiene_control)).length,
           maxCtrlSector: Math.max(0, ...Object.values(porSector).map(o => o.ctrlCasas.length)) };
}

const chip = (c, cl) => `<span class="${cl || ""}" onclick="focusCasa('${c.id_casa}')">${esc(c.id_casa)} · ${esc(c.numero)}</span>`;

function showCasa(id) {

      ${si(c.es_anfitriona) ? `<div>Anfitriona</div><div><b>sí</b> · alarma del ${esc(CONFIG.nombresSector[s] || s)}${si(c.modulo_identificador) ? " · <b>módulo identificador</b>" : ""}</div>` : ""}

function cajaFormulario(c, d) {
  if (!CONFIG.form.url) return "";
  const habilitado = !CONFIG.form.soloPendientes || d.pendiente || !d.aplica;

    return `<div class="aviso-box${d.pendiente ? " pend" : ""}">

        Se abre con la dirección y el nombre ya cargados. Datos administrados por la directiva vecinal de Faldeos III-II, solo para operar el sistema de alarmas.</div></div>`;
  }

    <div class="meta">El plazo para completar el formulario ya cerró y esta vivienda no tiene nada pendiente.

}
function ordenControl(n) { n = num(n); return n <= 20 ? n : n <= 40 ? n - 20 : n - 40; }
function textoControl(k) {
  const n = num(k.n_control);
  return `N° ${n} · orden ${ordenControl(n)} de ${CONFIG.cupos.controles} en la alarma · ID ${n} en el identificador${txt(k.estado) ? ` <span class="meta">(${esc(k.estado)})</span>` : ""}`;
}

function showAlarma(s) {
  const A = analisis(), o = A.porSector[s]; if (!o) return;
  lastDetail = () => showAlarma(s);
  if (activeTab !== "detalle") { activeTab = "detalle"; document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x.dataset.tab === "detalle")); }
  const col = CONFIG.colores[s] || "#3b82f6", al = o.al;
  let h = `<h2><span class="pill" style="background:${col}">Alarma ${esc(s)}</span> ${esc(CONFIG.nombresSector[s] || "")}</h2>
    <div class="sub">${o.anf ? `Anfitriona ${esc(o.anf.id_casa)} · ${esc(o.anf.calle)} ${esc(o.anf.numero)}` : `<b style="color:var(--warn)">Sin casa anfitriona definida</b> — sin círculo en el mapa`}${al.numero_sim ? " · SIM " + esc(al.numero_sim) : ""}${al.fecha_instalacion ? " · instalada " + esc(al.fecha_instalacion) : ""}</div>
    <div class="stat"><div><div class="n">${o.afilS.length}</div><div class="l">casas afiliadas</div></div><div><div class="n">${o.casas.length}</div><div class="l">casas del sector</div></div><div><div class="n">${o.lejana ? Math.round(o.lejana[0]) + " m" : "—"}</div><div class="l">afiliada más lejana</div></div></div>
    <h3>Cupos</h3>`;
  if (CONFIG.privado)
    h += `<div class="cupo"><div class="t"><span>Números cargados</span><span><b>${o.cargados.length}</b> / ${CONFIG.cupos.numeros}</span></div>${bar(o.cargados.length, CONFIG.cupos.numeros)}<div class="meta">${o.cts.length} teléfonos válidos en el sector · ${o.verificados.length} verificados por llamada</div></div>`;
  else
    h += `<div class="cupo"><div class="t"><span>Teléfonos registrados</span><span><b>${o.telSector}</b> / ${CONFIG.cupos.numeros}</span></div>${bar(o.telSector, CONFIG.cupos.numeros)}</div>`;
  h += `<div class="cupo"><div class="t"><span>Controles RF</span><span><b>${o.ctrlEnl.length}</b> enlazados / ${CONFIG.cupos.controles}</span></div>${bar(Math.max(o.ctrlEnl.length, o.ctrlCasas.length), CONFIG.cupos.controles)}<div class="meta">${o.ctrlCasas.length} casas con control · ${o.ctrlCasas.length > CONFIG.cupos.controles ? `<span style="color:var(--bad)">supera el tope de ${CONFIG.cupos.controles}: hay que reasignar</span>` : `bloque de numeración ${s === "A" ? "1–20" : s === "B" ? "21–40" : s === "C" ? "41–60" : "—"}`}</div></div>`;
  if (CONFIG.privado) {
    const r = o.r;
    h += `<h3>Radios de alcance ${r.editado ? `<span class="meta">(editados aquí · planilla: ${num(al.radio_audible_m)} / ${num(al.radio_rf_m)} m)</span>` : `<span class="meta">(valores de la planilla)</span>`}</h3>
      <div class="range"><label>Audible (sirena) <b>${r.audible} m</b></label><input type="range" min="30" max="600" step="5" value="${r.audible}" oninput="setRadio('${s}','audible',this.value)"><input type="number" min="0" max="2000" value="${r.audible}" onchange="setRadio('${s}','audible',this.value)"></div>
      <div class="range"><label>RF (controles) <b>${r.rf} m</b></label><input type="range" min="30" max="1000" step="5" value="${r.rf}" oninput="setRadio('${s}','rf',this.value)"><input type="number" min="0" max="3000" value="${r.rf}" onchange="setRadio('${s}','rf',this.value)"></div>
      <div class="meta" style="margin:6px 0 10px">Los ajustes se guardan solo en este navegador. Cuando midas en terreno, anota el valor definitivo en la pestaña <b>alarmas</b> de la planilla.${r.editado ? ` <a href="#" onclick="resetRadio('${s}');return false">Volver a los de la planilla</a>` : ""}</div>`;
  }
  h += `<h3>Cobertura con los radios actuales</h3>
    <div class="trig"><span class="st ${o.fueraAud.length ? "bad" : "ok"}"></span><div><b>${o.fueraAud.length ? plural(o.fueraAud.length, "afiliada") + " fuera del radio audible" : "Todas las afiliadas dentro del radio audible"}</b>${o.fueraAud.length ? `<div class="chips">${o.fueraAud.map(c => chip(c, "bad")).join("")}</div>` : ""}</div></div>
    <div class="trig"><span class="st ${o.fueraRF.length ? "bad" : "ok"}"></span><div><b>${o.fueraRF.length ? plural(o.fueraRF.length, "casa") + " con control fuera del alcance RF" : "Todos los controles dentro del alcance RF"}</b>${o.fueraRF.length ? `<div class="chips">${o.fueraRF.map(c => chip(c, "bad")).join("")}</div>` : ""}</div></div>
    <h3>Casas asignadas (${o.casas.length})</h3><div class="chips">${o.casas.map(c => chip(c, dg(c).pendiente ? "warn" : "")).join("")}</div>

}
function setRadio(s, k, v) { v = Math.max(0, num(v)); AJ.alarmas[s] = Object.assign(AJ.alarmas[s] || {}, { [k]: v }); saveAJ(); render(); showAlarma(s); }
function resetRadio(s) { delete AJ.alarmas[s]; saveAJ(); render(); showAlarma(s); }
function setEscala(v) { v = num(v); AJ.pxPorMetro = v > 0 && Math.abs(v - CONFIG.pxPorMetro) > 0.01 ? v : null; saveAJ(); render(); showResumen(); }

/* ---------------- pestaña Pendientes ---------------- */
function showPendientes() {
  const pend = DATA.casas.filter(c => dg(c).pendiente)
    .sort((a, b) => (dg(b).incons.length - dg(a).incons.length) || (dg(a).nTel - dg(b).nTel) || a.id_casa.localeCompare(b.id_casa));
  const total = DATA.casas.filter(c => dg(c).aplica).length;
  let h = `<h2>Viviendas con tareas pendientes</h2>
    <div class="sub">${pend.length} de ${total} viviendas afiliadas. Son las únicas que mantienen el formulario habilitado.</div>
    <div class="stat">
      <div><div class="n">${DATA.casas.filter(c => dg(c).aplica && dg(c).nTel === 0).length}</div><div class="l">sin teléfono</div></div>
      <div><div class="n">${DATA.casas.filter(c => { const d = dg(c); return d.aplica && d.nTel > 0 && d.nTel < CONFIG.minContactos; }).length}</div><div class="l">con solo uno</div></div>
      <div><div class="n">${DATA.casas.filter(c => dg(c).incons.length).length}</div><div class="l">con inconsistencias</div></div>
    </div>`;
  if (!pend.length) return setPanel(h + `<div class="empty">No queda nada pendiente. 🎉</div>`);
  h += `<h3>Detalle</h3><div class="lista">`;
  for (const c of pend) {
    const d = dg(c);
    h += `<div class="card" onclick="focusCasa('${c.id_casa}')">
      <b>${esc(c.id_casa)} · ${esc(c.calle)} ${esc(c.numero)} <span class="meta">· ${esc(CONFIG.nombresSector[txt(c.sector)] || txt(c.sector))}</span></b>
      <div style="margin-top:4px">${d.faltas.map(f => `<span class="tagline w">${esc(f)}</span>`).join("")}${d.incons.map(f => `<span class="tagline b">${esc(f)}</span>`).join("")}</div></div>`;
  }
  setPanel(h + `</div><div class="note">Toca una vivienda para verla en el plano. Los criterios: faltan teléfonos de los contactos asignados, contactos sin información obligatoria, datos sin verificar o inconsistencias detectadas.</div>`);
}

/* ---------------- pestaña Cobertura ---------------- */
function showResumen() {
  const A = analisis();
  const ctrlOk = A.totalCtrl <= CONFIG.cupos.controlesTotal, secOk = A.maxCtrlSector <= CONFIG.cupos.controles;
  const cts = CONFIG.privado ? DATA.contactos.filter(telOK) : [];
  const cargados = cts.filter(k => si(k.cargado_en_alarma));
  const afilSinTel = A.afil.filter(c => dg(c).nTel === 0);
  let h = `<h2>Cobertura y cupos</h2><div class="sub">Calculado con los radios actuales y la escala ${pxm().toFixed(1)} px/m</div>
    <div class="stat"><div><div class="n">${A.afil.length}</div><div class="l">afiliadas</div></div><div><div class="n">${A.totalCtrl}</div><div class="l">controles RF</div></div><div><div class="n">${DATA.alarmas.filter(a => byId[txt(a.id_casa_anfitriona)]).length}/${DATA.alarmas.length}</div><div class="l">alarmas ubicadas</div></div></div>

    <div class="trig"><span class="st ${ctrlOk ? "ok" : "bad"}"></span><div><b>${A.totalCtrl} controles en total</b> <span class="meta">(tope ${CONFIG.cupos.controlesTotal})</span></div></div>
    <div class="trig"><span class="st ${secOk ? "ok" : "bad"}"></span><div><b>Máximo ${A.maxCtrlSector} controles en un sector</b> <span class="meta">(tope ${CONFIG.cupos.controles})</span></div></div>
    <h3>Por alarma</h3>`;
  for (const [s, o] of Object.entries(A.porSector)) {
    const col = CONFIG.colores[s] || "#3b82f6";
    h += `<div class="card lista" style="border-left:4px solid ${col};cursor:pointer" onclick="showAlarma('${s}')"><b>${esc(CONFIG.nombresSector[s] || s)} <span class="meta">· ${o.anf ? esc(o.anf.id_casa) : "sin anfitriona"}</span></b>
      <div class="meta">${o.afilS.length} afiliadas · ${o.ctrlCasas.length} controles · ${CONFIG.privado ? o.cargados.length + "/" + CONFIG.cupos.numeros + " números cargados" : o.telSector + " teléfonos"} · radios ${o.r.audible} / ${o.r.rf} m${o.lejana ? ` · más lejana ${Math.round(o.lejana[0])} m` : ""}</div>
      ${o.fueraAud.length || o.fueraRF.length ? `<div class="meta" style="color:var(--bad)">${o.fueraAud.length} fuera audible · ${o.fueraRF.length} fuera RF</div>` : ""}</div>`;
  }
  if (CONFIG.privado) h += `<h3>Datos pendientes</h3>
    <div class="trig"><span class="st ${afilSinTel.length ? "warn" : "ok"}"></span><div><b>${plural(afilSinTel.length, "afiliada")} sin ningún teléfono válido</b>${afilSinTel.length ? `<div class="chips">${afilSinTel.map(c => chip(c, "bad")).join("")}</div>` : ""}</div></div>
    <div class="trig"><span class="st ${cargados.length < cts.length ? "warn" : "ok"}"></span><div><b>${cts.length - cargados.length} teléfonos válidos aún no cargados</b> <span class="meta">de ${cts.length}</span></div></div>
    <h3>Escala del plano</h3>
    <div class="range"><label>Píxeles por metro <b>${pxm().toFixed(1)}</b></label><input type="range" min="10" max="25" step=".1" value="${pxm()}" onchange="setEscala(this.value)"><input type="number" step=".1" value="${pxm().toFixed(1)}" onchange="setEscala(this.value)"></div>
    <div class="meta">Calibrada con el terreno C-02 (10,15 m de frente). Para verificarla: mide en terreno la distancia entre dos casas y compárala con la del panel.${AJ.pxPorMetro ? ` <a href="#" onclick="setEscala(${CONFIG.pxPorMetro});return false">Volver a ${CONFIG.pxPorMetro}</a>` : ""}</div>`;
  setPanel(h);
}

/* ---------------- formulario ---------------- */
function abrirForm(id) {
  const c = byId[id]; if (!c || !CONFIG.form.url) return;
  const adm = DATA.contactos.find(k => k.id_casa === id && (txt(k.rol).toLowerCase() === "administrador" || num(k.prioridad) === 1));
  const p = new URLSearchParams({ usp: "pp_url" });
  if (CONFIG.form.entryDireccion) p.set(CONFIG.form.entryDireccion, `${c.calle} ${c.numero}`);
  if (CONFIG.form.entryNombre && adm && txt(adm.nombre)) p.set(CONFIG.form.entryNombre, adm.nombre);
  if (CONFIG.form.entryIdCasa) p.set(CONFIG.form.entryIdCasa, c.id_casa);
  window.open(CONFIG.form.url + (CONFIG.form.url.includes("?") ? "&" : "?") + p.toString(), "_blank", "noopener");
}

/* ---------------- buscador ---------------- */
const q = document.getElementById("q");
function buscar() {
  const t = q.value.trim().toLowerCase(); if (!t) return;
  let c = DATA.casas.find(r => r.id_casa.toLowerCase() === t) || DATA.casas.find(r => String(r.numero) === t);
  if (!c) { const k = DATA.contactos.find(r => txt(r.nombre).toLowerCase().includes(t)); if (k) c = byId[k.id_casa]; }
  if (c) { focusCasa(c.id_casa); q.blur(); }
  else { q.style.borderColor = "var(--bad)"; setTimeout(() => q.style.borderColor = "", 800); }
}
q.addEventListener("keydown", e => { if (e.key === "Enter") buscar(); });
q.addEventListener("search", buscar);

document.addEventListener("DOMContentLoaded", loadAll);
</script>
