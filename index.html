<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alarmas comunitarias · Faldeos III-II (privado)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --ink:#16202b; --muted:#66707d; --faint:#9aa3ad; --bg:#eef1f4; --panel:#fff; --line:#e4e8ec; --soft:#f5f7f9;
    --gris:#c3c8cf; --ok:#1e9e5a; --warn:#d97706; --bad:#dc2626; --accent:#0f766e;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px -12px rgba(16,24,40,.25);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
  #app{display:grid;grid-template-columns:1fr 380px;grid-template-rows:56px 1fr;height:100%}
  header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#0f766e,#6a4fd8);display:grid;place-items:center;color:#fff;flex:none}
  .brand h1{font-size:15px;margin:0;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}
  .tag{font-size:10.5px;padding:3px 8px;border-radius:999px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
  .tag.priv{background:#fde8e8;color:#9b1c1c}.tag.pub{background:#e6f4ea;color:#166534}
  .search{position:relative;flex:1;max-width:380px;margin-left:auto}
  .search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:13px;background:var(--soft);outline:none}
  .search input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(15,118,110,.12)}
  .search svg{position:absolute;left:11px;top:9px;width:16px;height:16px;color:var(--faint)}
  .src{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .src i{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
  .src.live i{background:var(--ok)}
  #map{background:#e9ecef;position:relative}
  .layers{position:absolute;top:12px;right:12px;z-index:800;display:flex;flex-direction:column;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.96);border:1px solid var(--line);font-size:12px;font-weight:500;cursor:pointer;user-select:none;box-shadow:var(--shadow)}
  .chip input{margin:0;accent-color:var(--accent)}
  .chip .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .legend{white-space:nowrap;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:12px;line-height:1.85;box-shadow:var(--shadow);min-width:230px}
  .legend b{display:block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .legend .sw{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:7px;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
  .legend .sq{border-radius:2px;transform:rotate(45deg) scale(.8)}
  .legend .ring{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:7px;border:2px dashed #555}
  .legend .disc{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:7px;border:1.5px solid #555;background:rgba(85,85,85,.15)}
  aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px}
  .tabs button{flex:1;padding:12px 6px;border:0;background:none;font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
  .tabs button.on{color:var(--ink);border-color:var(--accent)}
  .body{overflow:auto;padding:16px;flex:1}
  h2{font-size:15px;margin:0 0 2px;font-weight:650;line-height:1.3}
  h3{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;font-weight:600}
  .sub{color:var(--muted);font-size:12.5px;margin-bottom:10px}
  .kv{display:grid;grid-template-columns:118px 1fr;gap:6px 10px;margin:10px 0;font-size:13px}
  .kv div:nth-child(odd){color:var(--muted)}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;color:#fff;vertical-align:middle}
  .card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:#fff}
  .card b{display:block;font-weight:600}
  .meta{color:var(--muted);font-size:12px}
  .card a{color:var(--ink);text-decoration:none;font-variant-numeric:tabular-nums;font-weight:500}
  .inf{color:var(--faint)}
  .empty{color:var(--muted);padding:24px 8px;text-align:center;line-height:1.5}
  .note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:16px;padding-top:10px;line-height:1.5}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:hover{filter:brightness(.97)}
  .formbox{margin:14px 0 4px;padding:12px;border-radius:10px;background:#eef7f5;border:1px solid #cfe7e2}
  .formbox .btn{width:100%;justify-content:center;font-size:13.5px;padding:10px}
  .formbox .meta{margin-top:8px;line-height:1.45}
  .stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}
  .stat div{background:var(--soft);border-radius:10px;padding:10px;text-align:center}
  .stat .n{font-size:20px;font-weight:700;line-height:1.1}
  .stat .l{font-size:11px;color:var(--muted);margin-top:3px}
  .bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden;margin:4px 0 2px}
  .bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}
  .bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
  .cupo{margin:8px 0 12px}
  .cupo .t{display:flex;justify-content:space-between;font-size:12.5px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
  .chips span{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--soft);cursor:pointer;border:1px solid transparent}
  .chips span:hover{border-color:var(--line);background:#fff}
  .chips span.bad{background:#fee2e2;color:#991b1b}
  .range{display:grid;grid-template-columns:1fr 74px;gap:8px;align-items:center;margin:6px 0}
  .range input[type=range]{width:100%;accent-color:var(--accent)}
  .range input[type=number]{width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:12.5px}
  .range label{grid-column:1/3;font-size:12.5px;display:flex;justify-content:space-between;color:var(--muted)}
  .range label b{color:var(--ink);font-weight:600}
  .trig{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .trig:last-child{border:0}
  .trig .st{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px}
  .st.ok{background:var(--ok)}.st.warn{background:var(--warn)}.st.bad{background:var(--bad)}
  .house{width:0;height:0}.house svg{overflow:visible;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35))}
  .lbl{font-size:11px;font-weight:600;color:#1c2430;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
  .lbl.inf{color:#7a8290;font-weight:500}
  .street{display:inline-block;position:absolute;left:0;top:0;font-size:13px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:#334155;white-space:nowrap;text-shadow:0 0 4px #fff,0 0 4px #fff,0 0 6px #fff;pointer-events:none}
  .idbadge{position:absolute;left:12px;top:-22px;background:#111827;color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;white-space:nowrap;letter-spacing:.3px}
  .leaflet-tooltip.num{background:transparent;border:0;box-shadow:none;padding:0}
  .leaflet-tooltip.num::before{display:none}
  .leaflet-container{font-family:inherit}
  .leaflet-bar a{color:var(--ink)}
  @media (max-width:820px){
    #app{grid-template-columns:1fr;grid-template-rows:56px 1fr 46vh}
    aside{border-left:0;border-top:1px solid var(--line)}
    .src{display:none}.brand small{display:none}.search{max-width:none}
    .legend{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M12 8v4"/><path d="M12 15h.01"/></svg></div>
      <div><h1>Alarmas comunitarias · Faldeos III-II</h1><small>Mapa de gestión · uso interno de la directiva</small></div>
    </div>
    <span class="tag priv">PRIVADO · con teléfonos</span>
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Buscar casa: número, id (E-19) o nombre…" autocomplete="off"></div>
    <span class="src" id="src"><i></i>cargando…</span>
  </header>
  <div id="map">
    <div class="layers" id="layers"></div>
  </div>
  <aside>
    <div class="tabs"><button class="on" data-tab="detalle">Detalle</button><button data-tab="resumen">Cobertura y cupos</button></div>
    <div class="body" id="panel"><div class="empty">Haz clic en una casa o en un círculo de alcance.</div></div>
  </aside>
</div>

<script>
// ===================== CONFIGURACIÓN =====================
// Pega aquí los enlaces "Publicar en la web → CSV" de cada pestaña de la planilla.
// Mientras estén vacíos, el mapa usa la copia embebida (SNAPSHOT) al final de este archivo.
const CONFIG = {
  csv: {
    casas:     "https://docs.google.com/spreadsheets/d/e/2PACX-1vQsTwkcmZm2w0N_GrKs9Pejb3WZ6Pt_iQANRcGoUyrnr3ynulg2lQQzkoWZEytyW0VBdZ75Fxkk_fu_/pub?single=true&output=csv&gid=913056490",
    contactos: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQsTwkcmZm2w0N_GrKs9Pejb3WZ6Pt_iQANRcGoUyrnr3ynulg2lQQzkoWZEytyW0VBdZ75Fxkk_fu_/pub?single=true&output=csv&gid=2118395776",
    controles: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQsTwkcmZm2w0N_GrKs9Pejb3WZ6Pt_iQANRcGoUyrnr3ynulg2lQQzkoWZEytyW0VBdZ75Fxkk_fu_/pub?single=true&output=csv&gid=1268667683",
    alarmas:   "https://docs.google.com/spreadsheets/d/e/2PACX-1vQsTwkcmZm2w0N_GrKs9Pejb3WZ6Pt_iQANRcGoUyrnr3ynulg2lQQzkoWZEytyW0VBdZ75Fxkk_fu_/pub?single=true&output=csv&gid=1504940346"
  },
  plano: { src: "plano.jpg", ancho: 3651, alto: 4953 },   // tamaño del PNG original en px (sistema de coord_x / coord_y)
  pxPorMetro: 17.3,               // escala calibrada con el terreno C-02 (10,15 m de frente = 174–177 px)
  cupos: { numeros: 200, controles: 20, controlesTotal: 60 },
  colores: { A: "#0e8f8a", B: "#6a4fd8", C: "#e07b1a", D: "#b5316b" },
  nombresSector: { A: "Sector A · Norte (A1)", B: "Sector B · Oriente (A2)", C: "Sector C · Surponiente (A3)", D: "Sector D" },
  vias: [
    { nombre: "Calle Jorge Armando Saavedra Plaza", x: 2100, y: 1000, rot: 27,  minZoom: -9 },
    { nombre: "Calle Inés Verdejo González",        x: 880,  y: 2750, rot: -80, minZoom: -9 },
    { nombre: "Calle Inés Verdejo González",        x: 1650, y: 4060, rot: 10,  minZoom: -1.75 },
    { nombre: "Calle Inés Verdejo González",        x: 2830, y: 3500, rot: -80, minZoom: -1.75 },
    { nombre: "Pasaje Rafael Segundo Araya Villanueva", x: 1620, y: 2590, rot: 30,  minZoom: -1.75 },
    { nombre: "Pasaje Alfonso del Carmen Araya Castillo", x: 1510, y: 3080, rot: -38, minZoom: -1.75 },
    { nombre: "Pasaje Dafne Castillo",              x: 2550, y: 3130, rot: -70, minZoom: -1.75 }
  ],
  privado: true,
  form: {   // Google Form de completado de datos (Etapa 5). Los entry.* son los IDs de las preguntas prellenadas.
    url: "https://docs.google.com/forms/d/e/1FAIpQLSfDikyDrbRmFa0d-H55p2ZRkf5KdFDhbRB5zBl_p0F-MJLtiw/viewform",
    entryIdCasa: "entry.195855574", entryDireccion: "entry.2050356861", entryNombre: "entry.223763820"
  }
};
// ==========================================================

const W = CONFIG.plano.ancho, H = CONFIG.plano.alto;
const toLL = (x, y) => [H - y, x];
const map = L.map("map", { crs: L.CRS.Simple, minZoom: -3, maxZoom: 2, zoomSnap: 0.25, zoomDelta: 0.5, attributionControl: false, zoomControl: false });
L.control.zoom({ position: "topleft" }).addTo(map);
const bounds = [[0, 0], [H, W]];
L.imageOverlay(CONFIG.plano.src, bounds, { opacity: 0.95 }).addTo(map);
map.fitBounds(bounds);
map.setMaxBounds([[-800, -800], [H + 800, W + 800]]);

const layers = { audible: L.layerGroup().addTo(map), rf: L.layerGroup().addTo(map), casas: L.layerGroup().addTo(map), vias: L.layerGroup().addTo(map) };
let DATA = { casas: [], contactos: [], controles: [], alarmas: [] };
let markers = {}, byId = {};
const si = v => (v || "").toString().trim().toLowerCase() === "sí";
const esc = s => (s ?? "").toString().replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const tel164 = v => { let d = String(v ?? "").replace(/\.0+$/, "").replace(/\D/g, ""); if (d.length === 9 && d[0] === "9") d = "56" + d; return d.length === 11 && d.startsWith("56") ? "+" + d : (v ?? "").toString().trim(); };
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) ? n : 0; };

// ---------- ajustes locales (radios y escala editados en la interfaz) ----------
const LS_KEY = "faldeos_ajustes_v1";
let AJ = { pxPorMetro: null, alarmas: {} };
try { AJ = Object.assign(AJ, JSON.parse(localStorage.getItem(LS_KEY) || "{}")); } catch (e) {}
const saveAJ = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(AJ)); } catch (e) {} };
const pxm = () => AJ.pxPorMetro || CONFIG.pxPorMetro;
function radios(al) {
  const o = AJ.alarmas[al.id_sector] || {};
  return { audible: o.audible ?? num(al.radio_audible_m), rf: o.rf ?? num(al.radio_rf_m), editado: o.audible != null || o.rf != null };
}
const distM = (a, b) => Math.hypot(num(a.coord_x) - num(b.coord_x), num(a.coord_y) - num(b.coord_y)) / pxm();

// ---------- carga ----------
function parseCSV(text) { return Papa.parse(text.trim(), { header: true, skipEmptyLines: true, transformHeader: h => h.trim() }).data; }
async function loadTab(name) {
  const url = CONFIG.csv[name];
  if (url) {
    const r = await fetch(url + (url.includes("?") ? "&" : "?") + "_=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(name + ": HTTP " + r.status);
    return { rows: parseCSV(await r.text()), live: true };
  }
  return { rows: parseCSV(SNAPSHOT[name]), live: false };
}
async function loadAll() {
  const names = ["casas", "contactos", "controles", "alarmas"]; let live = 0;
  for (const n of names) {
    try { const t = await loadTab(n); DATA[n] = t.rows; if (t.live) live++; }
    catch (e) { console.warn(e); DATA[n] = parseCSV(SNAPSHOT[n]); }
  }
  DATA.alarmas = DATA.alarmas.filter(a => /^[A-Z]$/.test((a.id_sector || "").trim()));
  byId = Object.fromEntries(DATA.casas.map(c => [c.id_casa, c]));
  const src = document.getElementById("src");
  src.className = "src" + (live === names.length ? " live" : "");
  const local = location.protocol === "file:";
  src.innerHTML = "<i></i>" + (live === names.length ? "Planilla en vivo" : live ? `${live}/4 pestañas en vivo` : "Copia local del " + SNAPSHOT_FECHA + (local ? " · abierto desde el disco" : ""));
  if (local && live < names.length) src.title = "Google no entrega los CSV a páginas abiertas desde el disco (origen file://). Publicado en un sitio web (GitHub Pages) o servido con http://localhost, el mapa lee la planilla en vivo.";
  render();
}

// ---------- capas conmutables ----------
const VIS = { audible: true, rf: true, noafil: true, numeros: true };
function buildLayerChips() {
  const el = document.getElementById("layers");
  const items = [["audible", "Alcance audible"], ["rf", "Alcance RF"], ["noafil", "Casas no afiliadas"], ["numeros", "Números de casa"]];
  el.innerHTML = items.map(([k, t]) => `<label class="chip"><input type="checkbox" data-k="${k}" ${VIS[k] ? "checked" : ""}> ${t}</label>`).join("");
  el.querySelectorAll("input").forEach(i => i.addEventListener("change", () => { VIS[i.dataset.k] = i.checked; render(); }));
}
buildLayerChips();

// ---------- render ----------
function colorCasa(c) { return si(c.afiliada) ? (CONFIG.colores[(c.sector || "").trim()] || "#3b82f6") : null; }
function iconCasa(c) {
  const col = colorCasa(c), fill = col || "#c3c8cf", stroke = col ? "#fff" : "#8f979f";
  const control = si(c.tiene_control), anf = si(c.es_anfitriona), comp = (c.afiliada || "").toLowerCase() === "compromiso", ident = si(c.modulo_identificador);
  let svg;
  if (anf) svg = `<svg width="36" height="36" viewBox="-18 -18 36 36"><circle r="15" fill="${fill}" stroke="#fff" stroke-width="2.5"/><path d="M0,-9.5 L2.8,-3 L9.7,-2.7 L4.3,1.7 L6.1,8.4 L0,4.6 L-6.1,8.4 L-4.3,1.7 L-9.7,-2.7 L-2.8,-3 Z" fill="#fff"/></svg>`;
  else if (control) svg = `<svg width="26" height="26" viewBox="-13 -13 26 26"><rect x="-8.5" y="-8.5" width="17" height="17" rx="3" transform="rotate(45)" fill="${fill}" stroke="${stroke}" stroke-width="2"/><circle r="2.6" fill="#fff"/></svg>`;
  else svg = `<svg width="24" height="24" viewBox="-12 -12 24 24"><circle r="8" fill="${fill}" stroke="${stroke}" stroke-width="2" ${comp ? 'stroke-dasharray="3 2"' : ""}/></svg>`;
  if (ident) svg += `<span class="idbadge">ID</span>`;
  return L.divIcon({ className: "house", html: svg, iconSize: [0, 0], iconAnchor: [0, 0] });
}
function alarmaDe(c) { return DATA.alarmas.find(a => (a.id_casa_anfitriona || "").trim() === c.id_casa); }
function render() {
  Object.values(layers).forEach(l => l.clearLayers()); markers = {};
  // círculos de alcance
  for (const al of DATA.alarmas) {
    const anf = byId[(al.id_casa_anfitriona || "").trim()]; if (!anf || !num(anf.coord_x)) continue;
    const col = CONFIG.colores[al.id_sector] || "#3b82f6", r = radios(al), ll = toLL(num(anf.coord_x), num(anf.coord_y));
    if (VIS.audible && r.audible > 0) L.circle(ll, { radius: r.audible * pxm(), color: col, weight: 1.5, fillColor: col, fillOpacity: .08, opacity: .8 }).on("click", () => showAlarma(al.id_sector)).addTo(layers.audible);
    if (VIS.rf && r.rf > 0) L.circle(ll, { radius: r.rf * pxm(), color: col, weight: 1.5, dashArray: "8 6", fill: false, opacity: .9 }).on("click", () => showAlarma(al.id_sector)).addTo(layers.rf);
  }
  for (const c of DATA.casas) {
    const x = num(c.coord_x), y = num(c.coord_y); if (!x || !y) continue;
    if (!VIS.noafil && !si(c.afiliada) && (c.afiliada || "").toLowerCase() !== "compromiso") continue;
    const m = L.marker(toLL(x, y), { icon: iconCasa(c), riseOnHover: true }).addTo(layers.casas);
    m.on("click", () => showCasa(c.id_casa));
    if (VIS.numeros) m.bindTooltip(`<span class="lbl">${esc(c.numero)}</span>`, { permanent: true, direction: "right", offset: [12, 0], className: "num", interactive: false });
    markers[c.id_casa] = m;
  }
  for (const v of CONFIG.vias) L.marker(toLL(v.x, v.y), { interactive: false, icon: L.divIcon({ className: "", html: `<div class="street" data-minzoom="${v.minZoom ?? -9}" style="transform:translate(-50%,-50%) rotate(${v.rot}deg)">${v.nombre}</div>`, iconSize: [0, 0] }) }).addTo(layers.vias);
  updateLabels();
  if (activeTab === "resumen") showResumen();
}
function updateLabels() {
  const z = map.getZoom();
  document.querySelectorAll(".leaflet-tooltip.num").forEach(el => el.style.display = z >= -1.25 ? "" : "none");

// ---------- análisis ----------
function analisis() {
  const afil = DATA.casas.filter(c => si(c.afiliada));
  const porSector = {};
  for (const al of DATA.alarmas) {
    const s = al.id_sector, anf = byId[(al.id_casa_anfitriona || "").trim()], r = radios(al);
    const casas = DATA.casas.filter(c => (c.sector || "").trim() === s);
    const afilS = casas.filter(c => si(c.afiliada));
    const ctrlCasas = afilS.filter(c => si(c.tiene_control));
    const ctrlEnl = DATA.controles.filter(k => (k.sector || "").trim() === s && ["enlazado", "probado"].includes((k.estado || "").trim().toLowerCase()));
    const cts = DATA.contactos.filter(k => byId[k.id_casa] && (byId[k.id_casa].sector || "").trim() === s && (k.estado_telefono || "ok").trim() === "ok");
    const cargados = cts.filter(k => si(k.cargado_en_alarma)), verificados = cargados.filter(k => si(k.verificado));
    const fueraAud = anf ? afilS.filter(c => distM(c, anf) > r.audible) : afilS;
    const fueraRF = anf ? ctrlCasas.filter(c => distM(c, anf) > r.rf) : ctrlCasas;
    const lejana = anf && afilS.length ? afilS.map(c => [distM(c, anf), c]).sort((a, b) => b[0] - a[0])[0] : null;
    porSector[s] = { al, anf, r, casas, afilS, ctrlCasas, ctrlEnl, cts, cargados, verificados, fueraAud, fueraRF, lejana };
  }
  const anfs = DATA.alarmas.map(a => ({ a, anf: byId[(a.id_casa_anfitriona || "").trim()], r: radios(a) })).filter(o => o.anf);
  const sinSirena = afil.filter(c => !anfs.some(o => distM(c, o.anf) <= o.r.audible));
  const sinRF = afil.filter(c => si(c.tiene_control) && !anfs.some(o => distM(c, o.anf) <= o.r.rf));
  const totalCtrl = afil.filter(c => si(c.tiene_control)).length;
  const maxCtrlSector = Math.max(0, ...Object.values(porSector).map(o => o.ctrlCasas.length));
  return { afil, porSector, sinSirena, sinRF, totalCtrl, maxCtrlSector };
}

function showAlarma(s) {

    <div class="cupo"><div class="t"><span>Controles RF</span><span><b>${o.ctrlEnl.length}</b> enlazados / ${CONFIG.cupos.controles} · ${o.ctrlCasas.length} casas con control</span></div>${bar(Math.max(o.ctrlEnl.length, o.ctrlCasas.length), CONFIG.cupos.controles)}<div class="meta">${o.ctrlCasas.length > CONFIG.cupos.controles ? `<span style="color:var(--bad)">Supera el tope de 20: reasignar casas a otro sector</span>` : `Bloque de numeración: ${s === "A" ? "1–20" : s === "B" ? "21–40" : s === "C" ? "41–60" : "—"}`}</div></div>`;

      <div class="range"><label>Audible (sirena) <b id="va">${r.audible} m</b></label><input type="range" min="30" max="600" step="5" value="${r.audible}" oninput="setRadio('${s}','audible',this.value)"><input type="number" min="0" max="2000" value="${r.audible}" onchange="setRadio('${s}','audible',this.value)"></div>

  }
  if (CONFIG.privado) h += `<h3>Datos pendientes</h3>
    <div class="trig"><span class="st ${afilSinTel.length ? "warn" : "ok"}"></span><div><b>${afilSinTel.length} afiliadas sin ningún teléfono válido</b>${afilSinTel.length ? `<div class="chips">${afilSinTel.map(c => chip(c, true)).join("")}</div>` : ""}</div></div>
